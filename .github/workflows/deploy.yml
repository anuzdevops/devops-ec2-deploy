name: Deploy to EC2
on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Fix: Clone if folder doesn't exist (for new Terraform EC2)
            if [ ! -d ~/devops-ec2-deploy ]; then
              cd ~
              git clone https://github.com/anuzdevops/devops-ec2-deploy.git
            fi
            
            cd ~/devops-ec2-deploy
            git pull origin main
            
            # Your build - keep same name myapp
            sudo docker build -t myapp .
            sudo docker stop myapp || true
            sudo docker rm myapp || true
            sudo docker run -d -p 5000:5000 --restart unless-stopped --name myapp myapp
            
            # Fix Nginx config - ensures it points to 5000
            sudo bash -c 'cat > /etc/nginx/sites-available/default <<EOF
            server {
                listen 80 default_server;
                listen [::]:80 default_server;
                location / {
                    proxy_pass http://127.0.0.1:5000;
                    proxy_set_header Host $host;
                    proxy_set_header X-Real-IP $remote_addr;
                }
            }
            EOF'
            sudo nginx -t && sudo systemctl restart nginx
            
            sudo docker ps
